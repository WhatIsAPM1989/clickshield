services:
  replay-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${REPLAY_S3_ACCESS_KEY:?set REPLAY_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${REPLAY_S3_SECRET_KEY:?set REPLAY_S3_SECRET_KEY}
    volumes:
      - clickshield_replay_data:/data

volumes:
  clickshield_replay_data:
