services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clickshield
      POSTGRES_USER: clickshield
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickshield -d clickshield"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MCP_ENABLED: "${MCP_ENABLED:-false}"
      GEOIP_CITY_DATABASE: "${GEOIP_CITY_DATABASE:-}"
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://clickshield:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/clickshield?sslmode=disable"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      OUTCOME_API_TOKEN: "${OUTCOME_API_TOKEN:-}"
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-}"
      ASN_DATABASE: "${ASN_DATABASE:-/app/ip2asn.tsv.gz}"
      BOOTSTRAP_PROJECT_NAME: "${BOOTSTRAP_PROJECT_NAME:-Demo site}"
      BOOTSTRAP_PROJECT_KEY: "${BOOTSTRAP_PROJECT_KEY:?set BOOTSTRAP_PROJECT_KEY in .env}"
      BOOTSTRAP_ALLOWED_ORIGINS: "${BOOTSTRAP_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}"
      YANDEX_COUNTER_ID: "${YANDEX_COUNTER_ID:-}"
      YANDEX_MEASUREMENT_TOKEN: "${YANDEX_MEASUREMENT_TOKEN:-}"
      GOOGLE_MEASUREMENT_ID: "${GOOGLE_MEASUREMENT_ID:-}"
      GOOGLE_API_SECRET: "${GOOGLE_API_SECRET:-}"
      RAW_EVENTS_TTL: "${RAW_EVENTS_TTL:-168h}"
      AGGREGATE_TTL: "${AGGREGATE_TTL:-4320h}"
      STALE_SESSION_AFTER: "${STALE_SESSION_AFTER:-30m}"
      FINISH_GRACE: "${FINISH_GRACE:-20s}"
volumes:
  pgdata:
