components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: |
        API token (cst_…) issued in the admin panel, section «API и MCP». Bound to one
        project or all projects, with scopes analytics:read|write, sessions:read|write,
        replay:read|write, projects:read|write (write implies read). No CSRF header needed.
    cookieAuth:
      type: apiKey
      in: cookie
      name: clickshield_session
    outcomeBearer:
      type: http
      scheme: bearer

  parameters:
    ProjectKey:
      name: key
      in: query
      required: true
      description: Public per-site tracker key.
      schema: { type: string, minLength: 8 }
    ProjectID:
      name: project_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    SessionID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }

  schemas:
    Classification:
      type: string
      enum: [HUMAN, SUSPICIOUS, BOT, KNOWN_BOT]

    Event:
      type: object
      required: [type, ts]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [pageview, heartbeat, mousemove, click, scroll, visibility, touch, automation, business]
        name: { type: string, minLength: 1, maxLength: 80, description: Required for business events }
        page_url: { type: string, format: uri }
        document_height: { type: number, minimum: 0, maximum: 10000000 }
        properties:
          type: object
          maxProperties: 32
          additionalProperties:
            type: [string, number, boolean, "null"]
          description: Scalar business parameters, maximum 8 KiB total.
        ts: { type: integer, description: Unix milliseconds }
        x: { type: number }
        y: { type: number }
        vw: { type: number }
        vh: { type: number }
        scroll_y: { type: number }
        depth: { type: number, minimum: 0, maximum: 1 }
        visible: { type: boolean }
        active_ms: { type: integer, minimum: 0 }
        idle_ms: { type: integer, minimum: 0 }
        page_index: { type: integer, minimum: 1 }
        pointer: { type: string }
        button: { type: integer }
        extra: { type: object, additionalProperties: true }

    EventBatch:
      type: object
      additionalProperties: false
      required: [session_id, visitor_id, batch_id, page_url, events]
      properties:
        session_id: { type: string, format: uuid }
        visitor_id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        sent_at: { type: integer }
        page_url: { type: string, format: uri }
        landing_url: { type: string, format: uri }
        referrer: { type: string }
        yandex_client_id: { type: string }
        google_client_id: { type: string }
        yclid: { type: string }
        gclid: { type: string }
        utm:
          type: object
          properties:
            source: { type: string }
            medium: { type: string }
            campaign: { type: string }
            term: { type: string }
            content: { type: string }
        fingerprint: { type: string }
        device: { type: object, additionalProperties: true }
        automation:
          type: object
          additionalProperties: { type: boolean }
        page_index: { type: integer, minimum: 1 }
        finish:
          type: boolean
          description: Optional redundant finish marker used by final sendBeacon batches.
        events:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/Event' }

    FinishRequest:
      type: object
      additionalProperties: false
      required: [session_id, visitor_id, batch_id]
      properties:
        session_id: { type: string, format: uuid }
        visitor_id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        reason: { type: string }
        sent_at: { type: integer }

    Stats:
      type: object
      required: [total, human, suspicious, bot, known_bot, unclassified, average_risk, paid_visits]
      properties:
        total: { type: integer }
        human: { type: integer }
        suspicious: { type: integer }
        bot: { type: integer }
        known_bot: { type: integer }
        unclassified: { type: integer }
        average_risk: { type: number }
        paid_visits: { type: integer }

    BotCategory:
      type: string
      description: automation marks undeclared clients (headless browsers, HTTP libraries) scored as regular sessions; every other category is a declared crawler classified KNOWN_BOT.
      enum: [search, ai, social, seo, ads, monitoring, feeds, security, other, automation]

    BotStat:
      type: object
      properties:
        name: { type: string }
        vendor: { type: string }
        category: { $ref: '#/components/schemas/BotCategory' }
        sessions: { type: integer }
        last_24h: { type: integer }
        last_7d: { type: integer }
        visitors: { type: integer }
        ips: { type: integer }
        known_bot: { type: integer }
        bot: { type: integer }
        suspicious: { type: integer }
        human: { type: integer }
        unclassified: { type: integer }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }

    SessionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        started_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        classification: { type: string }
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        yandex_client_id: { type: string }
        google_client_id: { type: string }
        yclid: { type: string }
        gclid: { type: string }
        utm_source: { type: string }
        utm_medium: { type: string }
        utm_campaign: { type: string }
        click_count: { type: integer }
        scroll_depth: { type: number }
        fingerprint: { type: string }
        ip: { type: string }
        asn: { type: string }
        as_org: { type: string }
        device_type: { type: string }
        manual_label: { type: string }

    Project:
      type: object
      required: [id, name, public_key, allowed_origins, mode, scoring_config]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        public_key: { type: string }
        allowed_origins:
          type: array
          items: { type: string }
        mode: { type: string, enum: [MONITORING, NOTIFY, BLOCKING, BLOCKING_BOTS] }
        scoring_config: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    ProjectWrite:
      type: object
      required: [name, allowed_origins]
      properties:
        name: { type: string, maxLength: 120 }
        allowed_origins:
          type: array
          minItems: 1
          items: { type: string }
        mode: { type: string, enum: [MONITORING, NOTIFY, BLOCKING, BLOCKING_BOTS], default: MONITORING }
        scoring_config: { type: object, additionalProperties: true }

    Integration:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        provider: { type: string, enum: [YANDEX_METRICA, GOOGLE_ANALYTICS] }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true }
        has_secret: { type: boolean }
        last_status: { type: string }
        last_error: { type: string }
        last_sent_at: { type: string, format: date-time }

    ReplayPart:
      type: object
      required: [session_id, visitor_id, page_id, page_index, page_url, sequence, part_index, part_count, started_at, ended_at, data]
      properties:
        session_id: { type: string, format: uuid }
        visitor_id: { type: string, format: uuid }
        page_id: { type: string, format: uuid }
        page_index: { type: integer, minimum: 1, maximum: 1000 }
        page_url: { type: string }
        sequence: { type: integer, minimum: 0, maximum: 5000 }
        part_index: { type: integer, minimum: 0 }
        part_count: { type: integer, minimum: 1, maximum: 64 }
        started_at: { type: integer, description: Unix milliseconds }
        ended_at: { type: integer, description: Unix milliseconds }
        data: { type: string, contentEncoding: base64 }

    AnalyticsDefinition:
      type: object
      required:
      - name
      - kind
      - window_minutes
      - steps
      properties:
        name:
          type: string
          maxLength: 120
        kind:
          type: string
          enum:
          - goal
          - funnel
        window_minutes:
          type: integer
          minimum: 1
          maximum: 10080
        steps:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            required:
            - type
            - value
            properties:
              type:
                type: string
                enum:
                - page
                - event
                - outcome
              value:
                type: string
              match:
                type: string
                enum:
                - exact
                - prefix
              properties:
                type: object
                additionalProperties:
                  type:
                  - string
                  - number
                  - boolean
                  - 'null'
    ApiTokenRequest:
      type: object
      required:
      - name
      - scopes
      properties:
        name:
          type: string
          maxLength: 120
        project_id:
          type: string
          description: Project UUID; empty for all projects
        scopes:
          type: array
          items:
            type: string
            enum: [analytics:read, analytics:write, sessions:read, sessions:write, replay:read, replay:write, projects:read, projects:write]
        days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    TrackedLinkRequest:
      type: object
      required:
      - name
      - destination
      - enabled
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: ^[a-zA-Z0-9_-]{3,80}$
        destination:
          type: string
          format: uri
        enabled:
          type: boolean
    TrackingPixelRequest:
      type: object
      required:
      - name
      - enabled
      properties:
        name:
          type: string
        enabled:
          type: boolean
    AnnotationRequest:
      type: object
      required:
      - at
      - text
      properties:
        at:
          type: string
          format: date-time
        text:
          type: string
          maxLength: 500
