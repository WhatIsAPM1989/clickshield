openapi: 3.1.0
info:
  title: ClickShield Antifraud API
  version: 1.3.0
  description: |
    Public tracker ingestion, product analytics, administration API, scoped API tokens and MCP.
    Public project keys identify a site but are not secrets. Administrative
    write operations require the session cookie with X-CSRF-Token, or an API token with the scope.
servers:
  - url: https://antifraud.example.com
paths:
  /login:
    get:
      summary: Admin login page
      responses:
        '200':
          description: HTML login form
          content:
            text/html:
              schema: { type: string }
        '303': { description: Already authenticated; redirect to dashboard }
    post:
      summary: Create an admin session
      description: |
        Validates same-host Origin when supplied. Sets an HttpOnly SameSite=Strict
        clickshield_session cookie on success (12 hours, or 90 days with remember=1;
        Secure when configured).
        Invalid credentials redirect to /login?error=1. Verify GET /v1/me after login.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                remember: { type: string, enum: ['1'], description: Keep the session for 90 days }
      responses:
        '303': { description: Redirect to dashboard on success or login form on invalid credentials }
        '400': { description: Invalid form (plain text) }
        '403': { description: Invalid Origin (plain text) }
        '429': { description: Login rate limit exceeded (plain text) }
        '500': { description: Unable to create session (plain text) }

  /invite/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      summary: Invite sign-up page
      responses:
        '200': { description: HTML sign-up form }
        '303': { description: 'Invalid or used invite; redirect to ?error=invalid' }
    post:
      summary: Accept a one-time invite and create a user
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password, password2]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
                password2: { type: string, format: password }
      responses:
        '303': { description: 'Redirect to dashboard with a 12-hour session, or to ?error=invalid/email/short/mismatch/exists' }
        '403': { description: Invalid Origin (plain text) }
        '429': { description: Rate limit exceeded (plain text) }

  /v1/invites:
    get:
      summary: List active invites (owner only)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Unused, unexpired invites
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        created_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a one-time invite valid for 7 days (owner only)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '201':
          description: Invite path, shown only once
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string, example: /invite/abc }
                  expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }

  /v1/invites/{id}:
    delete:
      summary: Revoke an unused invite (owner only)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Revoked }
        '403': { $ref: '#/components/responses/Error' }

  /v1/users:
    get:
      summary: List admin users (owner only)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        username: { type: string }
                        active: { type: boolean }
                        created_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }

  /v1/users/{id}/active:
    post:
      summary: Enable or disable a user; disabling ends their sessions (owner only)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /logout:
    post:
      summary: End the current admin session
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Session ended and cookie expired
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: Service and PostgreSQL are available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
        '503': { $ref: '#/components/responses/Error' }

  /tracker.js:
    get:
      summary: Browser tracker
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
      responses:
        '200':
          description: JavaScript tracker
          content:
            application/javascript:
              schema: { type: string }

  /v1/events:
    options:
      summary: CORS preflight for tracker batches
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
      responses:
        '204': { description: Origin allowed }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Receive a batch of behavioral events
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventBatch' }
          text/plain:
            schema:
              description: JSON serialized EventBatch; used by sendBeacon to avoid a preflight.
              type: string
      responses:
        '202':
          description: Batch accepted
          content:
            application/json:
              schema:
                type: object
                required: [inserted_events, decision]
                properties:
                  inserted_events: { type: integer, minimum: 0 }
                  decision: { type: string, enum: [MONITOR, ALLOW, BLOCK] }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1/session/finish:
    options:
      summary: CORS preflight for session finish
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
      responses:
        '204': { description: Origin allowed }
    post:
      summary: Request delayed finalization and scoring
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinishRequest' }
          text/plain:
            schema:
              description: JSON serialized FinishRequest.
              type: string
      responses:
        '202':
          description: Finish request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/outcomes:
    post:
      summary: Record a submitted lead from the site backend
      description: Requires Authorization Bearer OUTCOME_API_TOKEN. Does not change the lead decision.
      security: [{ outcomeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, external_id, status]
              properties:
                session_id: { type: string, format: uuid }
                external_id: { type: string, maxLength: 128 }
                status: { type: string, enum: [SUBMITTED] }
      responses:
        '200': { description: Lead linked to session }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/me:
    get:
      security: [{ cookieAuth: [] }]
      summary: Current administrator and CSRF token
      responses:
        '200':
          description: Authenticated administrator
          content:
            application/json:
              schema:
                type: object
                required: [user_id, username, csrf_token, expires_at, is_owner]
                properties:
                  is_owner: { type: boolean, description: True for the ADMIN_USERNAME user }
                  user_id: { type: string, format: uuid }
                  username: { type: string }
                  csrf_token: { type: string }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }

  /v1/stats:
    get:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Classification totals
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/bots:
    get:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Sessions per known bot and bot category
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Bot statistics, most active first
          content:
            application/json:
              schema:
                type: object
                properties:
                  bots:
                    type: array
                    items: { $ref: '#/components/schemas/BotStat' }
                  categories:
                    type: object
                    additionalProperties: { type: integer }
                  catalog_size: { type: integer }
        '401': { $ref: '#/components/responses/Error' }

  /v1/operations:
    get:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Operational counters for scoring, delivery, analytics projections and replay GC
      responses:
        '200':
          description: Operational counters; analytics_lag_seconds is the age of the oldest unacknowledged projection
          content:
            application/json:
              schema:
                type: object
                properties:
                  events_last_hour: { type: integer, format: int64 }
                  unscored_older_than_hour: { type: integer, format: int64 }
                  outbox_pending_older_hour: { type: integer, format: int64 }
                  outbox_failed: { type: integer, format: int64 }
                  outbox_sent_last_day: { type: integer, format: int64 }
                  analytics_pending: { type: integer, format: int64 }
                  analytics_lag_seconds: { type: integer, format: int64 }
                  analytics_retries: { type: integer, format: int64 }
                  replay_gc_failed: { type: integer, format: int64 }

  /v1/quality:
    get:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Automatic classification outcomes by device and traffic source
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200': { description: Reviewed lead outcome counts }

  /v1/sessions:
    get:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: List sessions
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: classification
          in: query
          description: Use UNCLASSIFIED for sessions awaiting scoring.
          schema: { type: string, enum: [HUMAN, SUSPICIOUS, BOT, KNOWN_BOT, UNCLASSIFIED] }
        - name: bot
          in: query
          description: Exact bot name as returned by /v1/bots.
          schema: { type: string }
        - name: bot_category
          in: query
          schema: { $ref: '#/components/schemas/BotCategory' }
        - name: paid_only
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Session page
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/SessionItem' }
                  limit: { type: integer }
                  offset: { type: integer }
        '401': { $ref: '#/components/responses/Error' }

  /v1/sessions/export.csv:
    get:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Export all sessions matching dashboard filters as UTF-8 CSV
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: classification
          in: query
          schema: { type: string, enum: [HUMAN, SUSPICIOUS, BOT, KNOWN_BOT, UNCLASSIFIED] }
        - name: bot
          in: query
          description: Exact bot name as returned by /v1/bots.
          schema: { type: string }
        - name: bot_category
          in: query
          schema: { $ref: '#/components/schemas/BotCategory' }
        - name: paid_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: CSV attachment
          content:
            text/csv:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}:
    get:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Session metadata, features, history and trajectory
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/label:
    post:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Manually override a session as BOT or HUMAN
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, enum: [BOT, HUMAN] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Classification saved and queued for enabled integrations
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/outcomes:
    post:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Mark a linked lead as qualified, spam or lost
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, external_id, status]
              properties:
                session_id: { type: string, format: uuid }
                external_id: { type: string }
                status: { type: string, enum: [QUALIFIED, SPAM, LOST] }
      responses:
        '200': { description: Outcome saved }
        '422': { $ref: '#/components/responses/Error' }

  /v1/projects:
    get:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: List projects
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
    post:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Create a project
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectWrite' }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/projects/{id}:
    put:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Update project mode, origins and scoring
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectWrite' }
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/projects/{id}/integrations:
    get:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Integration status without secret material
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Integration list
          content:
            application/json:
              schema:
                type: object
                properties:
                  integrations:
                    type: array
                    items: { $ref: '#/components/schemas/Integration' }

  /v1/projects/{id}/integrations/{provider}:
    put:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Configure Yandex Metrica or Google Analytics 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [yandex, google] }
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                counter_id: { type: string }
                measurement_token: { type: string, writeOnly: true }
                measurement_id: { type: string }
                api_secret: { type: string, writeOnly: true }
      responses:
        '200': { description: Integration saved }
        '422': { $ref: '#/components/responses/Error' }

  /v1/projects/{id}/integrations/{provider}/test:
    post:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Test Yandex delivery or validate a Google event payload
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [yandex, google] }
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string, format: uuid }
      responses:
        '200': { description: Diagnostic result }
        '404': { $ref: '#/components/responses/Error' }

  /v1/outbox:
    get:
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      summary: Delivery queue totals by status
      responses:
        '200':
          description: Outbox counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    additionalProperties: { type: integer }

  /v1/tracker/config:
    get:
      summary: Public replay configuration for a tracker project
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
      responses:
        '200': { description: Replay enabled flag, sample rate and transport limit }
        '403': { $ref: '#/components/responses/Error' }
  /v1/reports:
    get:
      summary: Preset aggregate analytics reports with unique visitor totals
      description: Session filters apply (project_id, classification including NO_BOTS, source, channel, campaign, landing_url, device, replay_only, from and exclusive to) plus exact-value dimension filters referrer, utm_source, utm_medium, utm_campaign, utm_content, utm_term, exit_page, os, browser, country, network. Rows form a hierarchy over the report dimensions; level is the number of leading dimensions a row groups by, and parent rows count unique visitors exactly. Conversion uses visits with at least one lead, not lead count. A bounce is a visit with one page lasting under 15 seconds. New visitors are visitors whose first visit to the project falls in the group. Average duration uses computed features or first-to-last event span.
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      parameters:
        - in: query
          name: report
          schema: { type: string, enum: [sources, referrers, campaigns, utm, terms, landing, exit, devices, browsers, geo, languages, networks, quality, bots, daily, hours, activity], default: sources }
        - in: query
          name: timezone
          description: IANA timezone for day, hour and weekday dimensions
          schema: { type: string, default: Europe/Moscow }
      responses:
        '200': { description: Report kind, dimension keys, hierarchical rows with level, exact totals and timezone }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/reports/timeline:
    get:
      summary: Report metrics over time, split by the report's first dimension
      description: Same filters as /v1/reports; from and to are required. Buckets cover the whole period in the given timezone, including empty ones. Without series the five largest values are returned. Time-based reports return totals only.
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      parameters:
        - in: query
          name: report
          schema: { type: string, default: sources }
        - in: query
          name: interval
          required: true
          schema: { type: string, enum: [hour, day, week, month] }
        - in: query
          name: series
          description: Values of the first dimension to split out, up to 20; repeat the parameter
          schema: { type: array, maxItems: 20, items: { type: string } }
          style: form
          explode: true
        - in: query
          name: total_only
          schema: { type: boolean, default: false }
        - in: query
          name: timezone
          schema: { type: string, default: Europe/Moscow }
      responses:
        '200': { description: Interval, bucket labels (YYYY-MM-DD HH:00), total metrics per bucket and per-series metrics }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { description: More than 1500 buckets for the period and interval }
  /v1/traffic:
    get:
      summary: Traffic sources, campaigns and landing pages with fraud and lead counts
      description: Accepts session filters including source, channel, campaign, landing_url, replay_only, from and to (RFC3339, exclusive to).
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      responses:
        '200': { description: Grouped traffic rows }
        '401': { $ref: '#/components/responses/Error' }
  /v1/replay:
    options:
      summary: Replay CORS preflight
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
      responses:
        '204': { description: Origin allowed }
    post:
      summary: Upload an idempotent fragment of a replay event array
      description: Base64 UTF-8 JSON bytes, up to 128 KiB decoded per fragment, at most 64 fragments per group and 20 MiB per session. Requires an existing owned session and enabled capture.
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
      requestBody:
        required: true
        content:
          text/plain:
            schema: { $ref: '#/components/schemas/ReplayPart' }
          application/json:
            schema: { $ref: '#/components/schemas/ReplayPart' }
      responses:
        '202': { description: Fragment stored or already present }
        '403': { description: Origin rejected or recording disabled }
        '409': { description: Unavailable session or conflicting fragment }
        '413': { description: Recording quota exceeded }
        '422': { description: Invalid fragment }
        '429': { description: Rate limit exceeded }
  /v1/sessions/{id}/replay:
    get:
      summary: Read session replay, grouped by recorded page
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Pages with rrweb event arrays, incomplete flags and expiry; expired or absent recordings have no pages }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      summary: Permanently delete this session recording and prevent recapture
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Recording deleted }
        '403': { description: CSRF token required }
  /v1/projects/{id}/replay:
    put:
      summary: Change replay capture and retention settings
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, sample_rate, retention_days]
              properties:
                enabled: { type: boolean }
                sample_rate: { type: integer, minimum: 0, maximum: 100 }
                retention_days: { type: integer, minimum: 1, maximum: 30 }
      responses:
        '200': { description: Settings updated; shortened retention applies to existing recordings }
        '403': { description: CSRF token required }
  /v1/projects/{id}/metrika-read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get Metrika counter and token-presence flag; never the token
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      responses:
        '200': { description: Connection metadata }
    put:
      summary: Save encrypted OAuth token with metrika:read scope
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counter_id]
              properties:
                counter_id: { type: string }
                oauth_token: { type: string, writeOnly: true, description: Blank keeps the existing token }
      responses:
        '200': { description: Connection saved }
        '403': { description: CSRF token required }
    delete:
      summary: Remove the OAuth connection
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      responses:
        '200': { description: Connection removed }
        '403': { description: CSRF token required }
  /v1/projects/{id}/metrika-report:
    get:
      summary: Read Metrika Reporting API on demand
      description: Last-source attribution, counter-local dates, full requested accuracy, 500 rows per page; response includes sampling metadata. No automatic join to ClickShield sessions.
      security: [{ cookieAuth: [] }, { apiToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: report, in: query, required: true, schema: { type: string, enum: [sources, campaigns, platforms, utm] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: offset, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: Metrika rows, totals, total_rows and sampling metadata }
        '422': { description: OAuth connection missing }
        '502': { description: Metrika request failed }

